<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1412" />
    <meta name="description" content="Explore personagens, origens e dimensões do multiverso Rick and Morty." />
    <link rel="preconnect" href="https://rickandmortyapi.com" crossorigin />
    <title>Multiverse Atlas — Explore o impossível</title>
    <script>
      try {
        const saved = localStorage.getItem('multiverse-theme');
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
          ? saved
          : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      } catch { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
